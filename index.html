<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" type="text/css" href="/src/style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LandscapeJS</title>
  <script type="module" src="/src/main.js"></script>
</head>

<body>

  <!-- GENERATED LANDSCAPE -->
  <div id="landscapejs" class="scene"></div>

  <div class="content">
    <div class="hero">
      <div class="hero-title">Landscape JS</div>
      <div class="hero-title hero-title-reflection" aria-hidden="true">Landscape JS</div>
    </div>

    <p class="tagline">Render the world — one frame at a time</p>

    <div class="cta-row">
      <a href="#" class="btn btn-primary">Get Started</a>
      <a href="#" class="btn btn-secondary">View Docs</a>
    </div>

    <div class="features">
      <span class="pill">WebGL Powered</span>
      <span class="pill">Zero Dependencies</span>
      <span class="pill">Procedural Terrain</span>
      <span class="pill">3.2kb gzipped</span>
      <span class="pill">Tree-Shakeable</span>
    </div>
  </div>

  <!-- CORNER DECORATIONS -->
  <div class="corner corner-tl">v1.0.0 — stable</div>
  <div class="corner corner-br">MIT License<br>open source</div>

  <!-- SCROLL HINT -->
  <div class="scroll-hint">
    <span>Explore</span>
    <div class="scroll-line"></div>
  </div>

  <div class="explore">
    <label>Color 1 <input type="text" name="color_1" id="color_1" /></label>
    <label>Color 2 <input type="text" name="color_2" id="color_2" /></label>
    <label>Color 3 <input type="text" name="color_3" id="color_3" /></label>
    <label>Color 4 <input type="text" name="color_4" id="color_4" /></label>
    <label>Color 5 <input type="text" name="color_5" id="color_5" /></label>
    <button>Generate New</button>
  </div>
</body>

</html>
