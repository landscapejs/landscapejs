<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooting Star</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #030712;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            display: block;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');

        function resize() {
            const w = Math.min(canvas.offsetWidth, 900);
            canvas.width = w * devicePixelRatio;
            canvas.height = Math.round(w * 0.55) * devicePixelRatio;
            canvas.style.height = Math.round(canvas.offsetWidth * 0.55) + 'px';
            draw();
        }

        function draw() {
            const W = canvas.width, H = canvas.height;
            ctx.clearRect(0, 0, W, H);

            // Background
            const bg = ctx.createLinearGradient(0, 0, 0, H);
            bg.addColorStop(0, '#020510');
            bg.addColorStop(1, '#0a0e2a');
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, W, H);

            // Background stars
            const rng = mulberry32(42);
            for (let i = 0; i < 220; i++) {
                const x = rng() * W, y = rng() * H;
                const size = rng() * 1.4 + 0.3;
                const alpha = rng() * 0.7 + 0.2;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,1)`;
                ctx.fill();
            }

            // Larger prominent stars
            const bigStars = [
                { x: 0.12, y: 0.1, r: 1.8 },
                { x: 0.88, y: 0.14, r: 2.1 },
                { x: 0.55, y: 0.07, r: 1.6 },
                { x: 0.76, y: 0.55, r: 1.5 },
                { x: 0.22, y: 0.72, r: 1.4 },
                { x: 0.93, y: 0.78, r: 1.6 },
            ];
            bigStars.forEach(s => {
                const x = s.x * W, y = s.y * H;
                const glow = ctx.createRadialGradient(x, y, 0, x, y, s.r * 6);
                glow.addColorStop(0, 'rgba(220,230,255,0.55)');
                glow.addColorStop(1, 'rgba(220,230,255,0)');
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, s.r * 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x, y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(240,245,255,0.95)';
                ctx.fill();
            });

            // === Shooting Star ===
            const angle = Math.PI * (195 / 180);
            const cx = W * 0.68, cy = H * 0.28;
            const trailLen = W * 0.38;

            const tx = cx - Math.cos(angle) * trailLen;
            const ty = cy - Math.sin(angle) * trailLen;

            const trail = ctx.createLinearGradient(tx, ty, cx, cy);
            trail.addColorStop(0, 'rgba(255,255,255,0)');
            trail.addColorStop(0.4, 'rgba(180,210,255,0.12)');
            trail.addColorStop(0.75, 'rgba(200,225,255,0.55)');
            trail.addColorStop(1, 'rgba(255,255,255,0.92)');

            const perpX = -Math.sin(angle), perpY = Math.cos(angle);
            const trailWidth = H * 0.012;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(tx - perpX * 0.5, ty - perpY * 0.5);
            ctx.lineTo(cx - perpX * trailWidth, cy - perpY * trailWidth);
            ctx.lineTo(cx + perpX * trailWidth, cy + perpY * trailWidth);
            ctx.lineTo(tx + perpX * 0.5, ty + perpY * 0.5);
            ctx.closePath();
            ctx.fillStyle = trail;
            ctx.fill();
            ctx.restore();

            // Wide soft glow around trail
            const glowWidth = trailWidth * 6;
            const wideGlow = ctx.createLinearGradient(tx, ty, cx, cy);
            wideGlow.addColorStop(0, 'rgba(140,180,255,0)');
            wideGlow.addColorStop(0.5, 'rgba(150,190,255,0.06)');
            wideGlow.addColorStop(1, 'rgba(200,220,255,0.18)');
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(tx - perpX * 1, ty - perpY * 1);
            ctx.lineTo(cx - perpX * glowWidth, cy - perpY * glowWidth);
            ctx.lineTo(cx + perpX * glowWidth, cy + perpY * glowWidth);
            ctx.lineTo(tx + perpX * 1, ty + perpY * 1);
            ctx.closePath();
            ctx.fillStyle = wideGlow;
            ctx.fill();
            ctx.restore();

            // Sparkle particles
            const sparkles = [
                { t: 0.72, off: -2.5, r: 1.8, a: 0.7 },
                { t: 0.58, off: 2.0, r: 1.4, a: 0.5 },
                { t: 0.45, off: -1.8, r: 1.1, a: 0.35 },
                { t: 0.33, off: 1.5, r: 0.9, a: 0.25 },
                { t: 0.82, off: 1.2, r: 1.6, a: 0.6 },
                { t: 0.90, off: -1.0, r: 1.2, a: 0.5 },
            ];
            sparkles.forEach(s => {
                const sx = tx + (cx - tx) * s.t + perpX * s.off * (trailWidth * 0.8);
                const sy = ty + (cy - ty) * s.t + perpY * s.off * (trailWidth * 0.8);
                const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, s.r * 4);
                sg.addColorStop(0, `rgba(220,235,255,${s.a})`);
                sg.addColorStop(1, 'rgba(180,210,255,0)');
                ctx.beginPath();
                ctx.arc(sx, sy, s.r * 4, 0, Math.PI * 2);
                ctx.fillStyle = sg;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.a + 0.2})`;
                ctx.fill();
            });

            // Bright star head
            const headR = trailWidth * 1.1;
            const hglow = ctx.createRadialGradient(cx, cy, 0, cx, cy, headR * 8);
            hglow.addColorStop(0, 'rgba(255,255,255,1)');
            hglow.addColorStop(0.08, 'rgba(240,248,255,0.9)');
            hglow.addColorStop(0.25, 'rgba(190,220,255,0.5)');
            hglow.addColorStop(0.6, 'rgba(160,200,255,0.12)');
            hglow.addColorStop(1, 'rgba(140,185,255,0)');
            ctx.beginPath();
            ctx.arc(cx, cy, headR * 8, 0, Math.PI * 2);
            ctx.fillStyle = hglow;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(cx, cy, headR, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.98)';
            ctx.fill();

            // Cross-flares (4-pointed)
            const flareLen = headR * 7;
            [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2].forEach(a => {
                const fg = ctx.createLinearGradient(cx, cy,
                    cx + Math.cos(a) * flareLen, cy + Math.sin(a) * flareLen);
                fg.addColorStop(0, 'rgba(255,255,255,0.8)');
                fg.addColorStop(0.3, 'rgba(200,225,255,0.25)');
                fg.addColorStop(1, 'rgba(180,210,255,0)');
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(a + Math.PI / 2) * headR * 0.35,
                    cy + Math.sin(a + Math.PI / 2) * headR * 0.35);
                ctx.lineTo(cx + Math.cos(a) * flareLen, cy + Math.sin(a) * flareLen);
                ctx.lineTo(cx - Math.cos(a + Math.PI / 2) * headR * 0.35,
                    cy - Math.sin(a + Math.PI / 2) * headR * 0.35);
                ctx.closePath();
                ctx.fillStyle = fg;
                ctx.fill();
                ctx.restore();
            });

            // Diagonal flares (along trail & perpendicular axes)
            [angle, angle + Math.PI / 2].forEach((a, i) => {
                const fl = flareLen * (i === 0 ? 1.4 : 0.7);
                [a, a + Math.PI].forEach(dir => {
                    const fg2 = ctx.createLinearGradient(cx, cy,
                        cx + Math.cos(dir) * fl, cy + Math.sin(dir) * fl);
                    fg2.addColorStop(0, 'rgba(255,255,255,0.5)');
                    fg2.addColorStop(0.3, 'rgba(200,225,255,0.15)');
                    fg2.addColorStop(1, 'rgba(180,210,255,0)');
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(cx + Math.cos(dir + Math.PI / 2) * headR * 0.2,
                        cy + Math.sin(dir + Math.PI / 2) * headR * 0.2);
                    ctx.lineTo(cx + Math.cos(dir) * fl, cy + Math.sin(dir) * fl);
                    ctx.lineTo(cx - Math.cos(dir + Math.PI / 2) * headR * 0.2,
                        cy - Math.sin(dir + Math.PI / 2) * headR * 0.2);
                    ctx.closePath();
                    ctx.fillStyle = fg2;
                    ctx.fill();
                    ctx.restore();
                });
            });
        }

        function mulberry32(a) {
            return function () {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                let t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        window.addEventListener('resize', resize);
        resize();
    </script>
</body>

</html>
