<link rel="stylesheet" type="text/css" href="/src/style.css">

<form>
    <div class="space-y-12">
        <div class="border-b border-white/10 pb-12">
            <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">
                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Seed</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input id="query" type="text" name="query"
                                class="block w-full rounded-l-md bg-white/5 px-3 py-1.5 text-base text-white outline-1 -outline-offset-1 outline-white/10 placeholder:text-gray-500 focus:outline-2 focus:-outline-offset-2 focus:outline-emerald-500 sm:text-sm/6" />
                        </div>
                        <button type="button"
                            class="inline-flex items-center gap-x-1.5 rounded-r-md bg-emerald-500 px-2.5 py-1.5 text-sm font-semibold text-white hover:bg-emerald-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor"
                                class="size-4">
                                <path
                                    d="M2.87 2.298a.75.75 0 0 0-.812 1.021L3.39 6.624a1 1 0 0 0 .928.626H8.25a.75.75 0 0 1 0 1.5H4.318a1 1 0 0 0-.927.626l-1.333 3.305a.75.75 0 0 0 .811 1.022 24.89 24.89 0 0 0 11.668-5.115.75.75 0 0 0 0-1.175A24.89 24.89 0 0 0 2.869 2.298Z" />
                            </svg>
                            Load
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="border-b border-white/10 pb-12">
            <div class="space-y-10">
                <fieldset>
                    <div class="space-y-6">
                        <div class="flex gap-3">
                            <div class="flex h-6 shrink-0 items-center">
                                <div class="group grid size-4 grid-cols-1">
                                    <input id="underwater" type="checkbox" name="underwater" checked
                                        aria-describedby="underwater-description"
                                        class="col-start-1 row-start-1 appearance-none rounded-sm border border-white/10 bg-white/5 checked:border-emerald-500 checked:bg-emerald-500 indeterminate:border-emerald-500 indeterminate:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 disabled:border-white/5 disabled:bg-white/10 disabled:checked:bg-white/10 forced-colors:appearance-auto" />
                                    <svg viewBox="0 0 14 14" fill="none"
                                        class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white group-has-disabled:stroke-white/25">
                                        <path d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="opacity-0 group-has-checked:opacity-100" />
                                        <path d="M3 7H11" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="opacity-0 group-has-indeterminate:opacity-100" />
                                    </svg>
                                </div>
                            </div>
                            <div class="text-sm/6">
                                <label for="underwater" class="font-medium text-white">Underwater?</label>
                                <p id="underwater-description" class="text-gray-400">Create an underwater landscape.</p>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </div>

        <div class="border-b border-white/10 pb-12">
            <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-6">

                <div class="col-span-full">
                    <div class="mt-6 space-y-6">
                        <div class="flex gap-3">
                            <div class="flex h-6 shrink-0 items-center">
                                <div class="group grid size-4 grid-cols-1">
                                    <input id="draw-water" type="checkbox" name="draw-water" checked
                                        aria-describedby="draw-water-description"
                                        class="col-start-1 row-start-1 appearance-none rounded-sm border border-white/10 bg-white/5 checked:border-emerald-500 checked:bg-emerald-500 indeterminate:border-emerald-500 indeterminate:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 disabled:border-white/5 disabled:bg-white/10 disabled:checked:bg-white/10 forced-colors:appearance-auto" />
                                    <svg viewBox="0 0 14 14" fill="none"
                                        class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white group-has-disabled:stroke-white/25">
                                        <path d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="opacity-0 group-has-checked:opacity-100" />
                                        <path d="M3 7H11" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="opacity-0 group-has-indeterminate:opacity-100" />
                                    </svg>
                                </div>
                            </div>
                            <div class="text-sm/6">
                                <label for="draw-water" class="font-medium text-white">Water?</label>
                                <p id="draw-water-description" class="text-gray-400">Draw the water body.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Number of waves</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input type="range" id="waves" min="0" max="100" value="50"
                                class="w-full h-2 rounded-full cursor-pointer accent-emerald-600"
                                oninput="document.getElementById('waves-value').textContent = this.value">
                            <div class="text-center mt-1">
                                <span id="waves-value" class="text-xs font-medium text-slate-400">50</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Number of weeds</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input type="range" id="weeds" min="0" max="100" value="50"
                                class="w-full h-2 rounded-full cursor-pointer accent-emerald-600"
                                oninput="document.getElementById('weeds-value').textContent = this.value">
                            <div class="text-center mt-1">
                                <span id="weeds-value" class="text-xs font-medium text-slate-400">50</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Number of bubbles</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input type="range" id="bubbles" min="0" max="100" value="50"
                                class="w-full h-2 rounded-full cursor-pointer accent-emerald-600"
                                oninput="document.getElementById('bubbles-value').textContent = this.value">
                            <div class="text-center mt-1">
                                <span id="bubbles-value" class="text-xs font-medium text-slate-400">50</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="border-b border-white/10 pb-12">
            <div class="mt-10 grid grid-cols-1 gap-x-6 gap-y-8 sm:grid-cols-4">

                <div class="col-span-full">
                    <div class="mt-6 space-y-6">
                        <div class="flex gap-3">
                            <div class="flex h-6 shrink-0 items-center">
                                <div class="group grid size-4 grid-cols-1">
                                    <input id="draw-sky" type="checkbox" name="draw-sky" checked
                                        aria-describedby="draw-sky-description"
                                        class="col-start-1 row-start-1 appearance-none rounded-sm border border-white/10 bg-white/5 checked:border-emerald-500 checked:bg-emerald-500 indeterminate:border-emerald-500 indeterminate:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 disabled:border-white/5 disabled:bg-white/10 disabled:checked:bg-white/10 forced-colors:appearance-auto" />
                                    <svg viewBox="0 0 14 14" fill="none"
                                        class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white group-has-disabled:stroke-white/25">
                                        <path d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="opacity-0 group-has-checked:opacity-100" />
                                        <path d="M3 7H11" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="opacity-0 group-has-indeterminate:opacity-100" />
                                    </svg>
                                </div>
                            </div>
                            <div class="text-sm/6">
                                <label for="draw-sky" class="font-medium text-white">Sky?</label>
                                <p id="draw-sky-description" class="text-gray-400">Draw the sky.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <div class="mt-6 space-y-6">
                        <div class="flex gap-3">
                            <div class="flex h-6 shrink-0 items-center">
                                <div class="group grid size-4 grid-cols-1">
                                    <input id="draw-moon" type="checkbox" name="draw-moon" checked
                                        aria-describedby="draw-moon-description"
                                        class="col-start-1 row-start-1 appearance-none rounded-sm border border-white/10 bg-white/5 checked:border-emerald-500 checked:bg-emerald-500 indeterminate:border-emerald-500 indeterminate:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 disabled:border-white/5 disabled:bg-white/10 disabled:checked:bg-white/10 forced-colors:appearance-auto" />
                                    <svg viewBox="0 0 14 14" fill="none"
                                        class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white group-has-disabled:stroke-white/25">
                                        <path d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="opacity-0 group-has-checked:opacity-100" />
                                        <path d="M3 7H11" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="opacity-0 group-has-indeterminate:opacity-100" />
                                    </svg>
                                </div>
                            </div>
                            <div class="text-sm/6">
                                <label for="draw-moon" class="font-medium text-white">Moon?</label>
                                <p id="draw-moon-description" class="text-gray-400">Draw the moon.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <div class="mt-6 space-y-6">
                        <div class="flex gap-3">
                            <div class="flex h-6 shrink-0 items-center">
                                <div class="group grid size-4 grid-cols-1">
                                    <input id="draw-sun" type="checkbox" name="draw-sun" checked
                                        aria-describedby="draw-sun-description"
                                        class="col-start-1 row-start-1 appearance-none rounded-sm border border-white/10 bg-white/5 checked:border-emerald-500 checked:bg-emerald-500 indeterminate:border-emerald-500 indeterminate:bg-emerald-500 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500 disabled:border-white/5 disabled:bg-white/10 disabled:checked:bg-white/10 forced-colors:appearance-auto" />
                                    <svg viewBox="0 0 14 14" fill="none"
                                        class="pointer-events-none col-start-1 row-start-1 size-3.5 self-center justify-self-center stroke-white group-has-disabled:stroke-white/25">
                                        <path d="M3 8L6 11L11 3.5" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round" class="opacity-0 group-has-checked:opacity-100" />
                                        <path d="M3 7H11" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="opacity-0 group-has-indeterminate:opacity-100" />
                                    </svg>
                                </div>
                            </div>
                            <div class="text-sm/6">
                                <label for="draw-sun" class="font-medium text-white">Sun?</label>
                                <p id="draw-sun-description" class="text-gray-400">Draw the sun.</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Number of stars</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input type="range" id="stars" min="0" max="100" value="50"
                                class="w-full h-2 rounded-full cursor-pointer accent-emerald-600"
                                oninput="document.getElementById('stars-value').textContent = this.value">
                            <div class="text-center mt-1">
                                <span id="stars-value" class="text-xs font-medium text-slate-400">50</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Number of mountains</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input type="range" id="mountains" min="0" max="100" value="50"
                                class="w-full h-2 rounded-full cursor-pointer accent-emerald-600"
                                oninput="document.getElementById('mountains-value').textContent = this.value">
                            <div class="text-center mt-1">
                                <span id="mountains-value" class="text-xs font-medium text-slate-400">50</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-span-full">
                    <label for="query" class="block text-sm/6 font-medium text-white">Horizon height</label>
                    <div class="mt-2 flex">
                        <div class="-mr-px grid grow grid-cols-1 focus-within:relative">
                            <input type="range" id="horizon" min="0" max="100" value="50"
                                class="w-full h-2 rounded-full cursor-pointer accent-emerald-600"
                                oninput="document.getElementById('horizon-value').textContent = this.value">
                            <div class="text-center mt-1">
                                <span id="horizon-value" class="text-xs font-medium text-slate-400">50</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="sm:col-span-2 sm:col-start-1">
                    <label for="city" class="block text-sm/6 font-medium text-white text-center">Sky Color #1</label>
                    <div class="flex flex-col items-center p-4 rounded-xl">
                        <input type="color" id="color1" value="#3b82f6" class="mb-3 rounded-full">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label for="region" class="block text-sm/6 font-medium text-white text-center">Sky Color #2</label>
                    <div class="flex flex-col items-center p-4 rounded-xl">
                        <input type="color" id="color2" value="#10b981" class="mb-3 rounded-full">
                    </div>
                </div>

                <div class="sm:col-span-2 sm:col-start-1">
                    <label for="city" class="block text-sm/6 font-medium text-white text-center">Ground Color #1</label>
                    <div class="flex flex-col items-center p-4 rounded-xl">
                        <input type="color" id="color3" value="#f59e0b" class="mb-3 rounded-full">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label for="region" class="block text-sm/6 font-medium text-white text-center">Ground Color
                        #2</label>
                    <div class="flex flex-col items-center p-4 rounded-xl">
                        <input type="color" id="color4" value="#ef4444" class="mb-3 rounded-full">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="mt-6 flex items-center justify-end gap-x-6">
        <button type="submit"
            class="rounded-md bg-emerald-500 px-3 py-2 text-sm font-semibold text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-500">Apply</button>
    </div>
</form>



<!-- Include this script tag or install `@tailwindplus/elements` via npm: -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindplus/elements@1" type="module"></script>
<button command="show-modal" commandfor="drawer" class="rounded-md bg-gray-950/5 px-2.5 py-1.5 text-sm font-semibold text-gray-900 hover:bg-gray-950/10">Open drawer</button>
<el-dialog>
  <dialog id="drawer" aria-labelledby="drawer-title" class="fixed inset-0 size-auto max-h-none max-w-none overflow-hidden bg-transparent not-open:hidden backdrop:bg-transparent">
    <el-dialog-backdrop class="absolute inset-0 bg-gray-500/75 transition-opacity duration-500 ease-in-out data-closed:opacity-0"></el-dialog-backdrop>

    <div tabindex="0" class="absolute inset-0 pl-10 focus:outline-none sm:pl-16">
      <el-dialog-panel class="group/dialog-panel relative ml-auto block size-full max-w-md transform transition duration-500 ease-in-out data-closed:translate-x-full sm:duration-700">
        <!-- Close button, show/hide based on slide-over state. -->
        <div class="absolute top-0 left-0 -ml-8 flex pt-4 pr-2 duration-500 ease-in-out group-data-closed/dialog-panel:opacity-0 sm:-ml-10 sm:pr-4">
          <button type="button" command="close" commandfor="drawer" class="relative rounded-md text-gray-300 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600">
            <span class="absolute -inset-2.5"></span>
            <span class="sr-only">Close panel</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" data-slot="icon" aria-hidden="true" class="size-6">
              <path d="M6 18 18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>

        <div class="relative flex h-full flex-col overflow-y-auto bg-white py-6 shadow-xl">
          <div class="px-4 sm:px-6">
            <h2 id="drawer-title" class="text-base font-semibold text-gray-900">Panel title</h2>
          </div>
          <div class="relative mt-6 flex-1 px-4 sm:px-6">
            <!-- Your content -->
          </div>
        </div>
      </el-dialog-panel>
    </div>
  </dialog>
</el-dialog>
