<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooting Star</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(to bottom, #0c0c1e, #1a1a3e);
        }

        canvas {
            border: 1px solid #333;
        }
    </style>
</head>

<body>
    <canvas id="starCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');

        // Draw background stars
        function drawBackgroundStars() {
            ctx.fillStyle = 'white';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Draw shooting star
        function drawShootingStar() {
            const startX = 150;
            const startY = 100;
            const length = 200;
            const angle = Math.PI / 4; // 45 degrees

            // Draw the tail (gradient trail)
            const gradient = ctx.createLinearGradient(
                startX, startY,
                startX + length * Math.cos(angle),
                startY + length * Math.sin(angle)
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 200, 0.8)');
            gradient.addColorStop(0.6, 'rgba(255, 200, 150, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 100, 50, 0)');

            ctx.strokeStyle = gradient;
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            ctx.lineTo(
                startX + length * Math.cos(angle),
                startY + length * Math.sin(angle)
            );
            ctx.stroke();

            // Draw the star head (bright point)
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(startX, startY, 6, 0, Math.PI * 2);
            ctx.fill();

            // Add glow effect
            ctx.shadowColor = 'white';
            ctx.shadowBlur = 20;
            ctx.beginPath();
            ctx.arc(startX, startY, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // Draw everything
        drawBackgroundStars();
        drawShootingStar();
    </script>
</body>

</html>
